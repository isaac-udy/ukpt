# Project
ukpt.projectName=ukpt
ukpt.projectNamespace=com.isaacudy.ukpt

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# Configuration cache stays OFF: the Compose-MP / Kotlin-wasm web target is not
# config-cache-compatible — `compileKotlinWasmJs` and the compose.resources / npm /
# webpack tasks reference `Project` at execution time, which fails the build (including
# the documented compile sweep, since it builds the wasm target). Re-enable only once
# that is fixed upstream and the full compile sweep + web bundle verify clean.
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.incremental.native=true
kotlin.incremental.wasm=true
