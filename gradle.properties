# Project
ukpt.projectName=ukpt
ukpt.projectNamespace=com.isaacudy.ukpt

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# The full compile sweep (all six targets, wasm included) and the architecture tasks are
# config-cache clean, and reusing the entry takes the sweep from ~45s to ~5s.
#
# Two task families are NOT compatible and must be run with `--no-configuration-cache`:
#   - wasmJsBrowserDevelopment{Run,Webpack} — the Kotlin plugin's `KotlinWebpack` task holds a
#     `Project` reference and an unserializable `SoftReference` (NodeJsRootPluginApplier). Upstream.
#   - record/verifyPaparazzi — the R class is dropped from the test runtime classpath under the
#     cache, so the snapshot tests die with `ClassNotFoundException: …R`.
# Both are documented at their call sites in UKPT.md.
#
# NOTE for anyone debugging a new `cannot serialize DefaultProject` / `Gradle script object
# references` failure: suspect a `doFirst`/`doLast` closure in a build script before blaming the
# plugin. A lambda that touches `project`/`layout` — or any script-level `val`, which is really a
# property of the script class — drags the whole script into the task's serialized state. Bind the
# value to a local *inside* the task-configuration action and close over only that.
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.incremental.native=true
kotlin.incremental.wasm=true
