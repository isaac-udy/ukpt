# Project
ukpt.projectName=ukpt
ukpt.projectNamespace=com.isaacudy.ukpt
# Builds the Compose HTML web client, :app:client:web-html. Modules that apply ukpt.html-web then
# also compile for Kotlin/JS, and each Compose UI screen needs a Compose HTML override in jsMain.
ukpt.htmlWebClient=false

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
# The full compile sweep (all six targets, wasm included), the web webpack and dev-server tasks,
# and the architecture tasks are config-cache clean, and reusing the entry takes the sweep from
# ~45s to ~5s.
#
# record/verifyPaparazzi is NOT compatible and must be run with `--no-configuration-cache`: the R
# class is dropped from the test runtime classpath under the cache, so the snapshot tests die with
# `ClassNotFoundException: …R`. The `ukpt-verify` skill documents this.
#
# NOTE for anyone debugging a new `cannot serialize DefaultProject` / `Gradle script object
# references` failure: suspect a lambda in a build script before blaming the plugin — a
# `doFirst`/`doLast` closure, or a `commonWebpackConfig` block, which the webpack tasks store. A
# lambda that touches `project`/`layout` — or any script-level `val`, which is really a property of
# the script class — drags the whole script into the task's serialized state. Bind the value to a
# local outside the lambda and close over only that.
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.incremental.native=true
kotlin.incremental.wasm=true
