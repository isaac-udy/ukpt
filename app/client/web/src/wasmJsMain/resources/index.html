<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ukpt</title>
    <!-- A host that serves deep links through an index.html fallback delivers this document at any
         path. Without an explicit base, the relative script URLs below resolve under that path and
         come back as this page instead of JavaScript. -->
    <base href="/">
    <!-- The boot screen, shown from the moment this document parses until Compose draws its first
         frame. The design system lives inside the bundle, so this restates the background and ink
         colours of its Light and Dark palettes (platform/client/design) as literal values over the
         system font stack. A project that changes its palette restates it here. -->
    <style>
        :root {
            --boot-background: #FFFFFF;
            --boot-ink: #18181B;
            --boot-ink-secondary: #52525B;
            --boot-accent: #3F3F46;
            --boot-track: #F4F4F5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --boot-background: #09090B;
                --boot-ink: #FAFAFA;
                --boot-ink-secondary: #A1A1AA;
                --boot-accent: #E4E4E7;
                --boot-track: #18181B;
            }
        }

        html {
            background: var(--boot-background);
        }

        .boot,
        .boot-fallback {
            position: fixed;
            inset: 0;
            z-index: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--boot-background);
            color: var(--boot-ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .boot {
            display: flex;
            transition: opacity 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .boot[data-fading] {
            opacity: 0;
        }

        .boot-fallback {
            display: none;
            padding: 0 1.25rem;
            text-align: center;
        }

        html.no-webgl .boot {
            display: none;
        }

        html.no-webgl .boot-fallback {
            display: flex;
        }

        .boot-status {
            font-size: 0.9375rem;
            line-height: 1.47;
            color: var(--boot-ink-secondary);
            animation: boot-pulse 1s linear infinite alternate;
        }

        .boot-spinner {
            margin-top: 1.5rem;
            animation: boot-spin 0.9s linear infinite;
        }

        .boot-spinner circle {
            stroke: var(--boot-accent);
        }

        .boot-progress {
            display: flex;
            margin-top: 1.5rem;
            width: 12.5rem;
            flex-direction: column;
            align-items: center;
        }

        .boot-progress[hidden] {
            display: none;
        }

        .boot-track {
            width: 100%;
            height: 0.375rem;
            border-radius: 0.1875rem;
            background: var(--boot-track);
            overflow: hidden;
        }

        .boot-bar {
            /* scaleX, not width: a width change needs main-thread layout, and the main thread is
               busy while the wasm binaries compile, so the bar would stall. A transform animates
               on the compositor thread. */
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: var(--boot-accent);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 150ms linear;
        }

        .boot-percent {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.33;
            font-variant-numeric: tabular-nums;
            color: var(--boot-ink-secondary);
        }

        .boot-fallback-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .boot-fallback-message {
            max-width: 34rem;
            line-height: 1.5;
            color: var(--boot-ink-secondary);
        }

        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @keyframes boot-pulse { from { opacity: 0.45; } to { opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            .boot-spinner { animation: none; }
            .boot-status { animation: none; }
            .boot-bar { transition: none; }
        }
    </style>
    <script type="application/javascript">
        // WebGL pre-flight. skiko (Compose's web renderer) acquires a WebGL context at startup;
        // when the browser can't provide one — hardware acceleration off, GPU blocklisted, or
        // contexts exhausted — it dies with an uncaught "getParameter of undefined" and the page
        // stays blank. The renderer is the broken part, so the message can't come from Compose:
        // probe here, before the bundle loads, and on failure reveal the .boot-fallback markup
        // instead of loading (and trapping) the app.
        (function () {
            "use strict";
            function webGlAvailable() {
                try {
                    var c = document.createElement("canvas");
                    var gl = c.getContext("webgl2") || c.getContext("webgl") ||
                        c.getContext("experimental-webgl");
                    if (!gl) return false;
                    // Release the probe context so it doesn't occupy one of the browser's limited
                    // WebGL slots.
                    var lose = gl.getExtension("WEBGL_lose_context");
                    if (lose) lose.loseContext();
                    return true;
                } catch (e) {
                    return false;
                }
            }

            if (!webGlAvailable()) {
                document.documentElement.className = "no-webgl";
                return;
            }

            var app = document.createElement("script");
            app.type = "application/javascript";
            app.src = "App.js";
            document.head.appendChild(app);
        })();
    </script>
</head>
<body>
<div class="boot" id="boot">
    <div class="boot-status" id="boot-status">Loading…</div>
    <svg class="boot-spinner" id="boot-spinner" width="32" height="32" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="40 86"/>
    </svg>
    <div class="boot-progress" id="boot-progress" hidden
         role="progressbar" aria-label="Downloading"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="boot-track"><div class="boot-bar" id="boot-bar"></div></div>
        <div class="boot-percent" id="boot-percent">0%</div>
    </div>
</div>
<div class="boot-fallback" id="boot-fallback" role="alert">
    <h1 class="boot-fallback-title">Graphics acceleration is off</h1>
    <p class="boot-fallback-message">
        This app renders with WebGL, which your browser isn’t providing — usually because hardware
        acceleration is turned off. Turn it on in your browser settings (Chrome or Edge:
        <b>Settings → System</b>) and relaunch, or open the app in a different browser.
    </p>
</div>
<!-- Uncompressed sizes of the wasm binaries this build emitted, written by
     webpack.config.d/wasm-manifest.js. It runs before the script below, which reads the total;
     without it the progress bar never appears. -->
<script type="application/javascript" src="wasm-manifest.js"></script>
<script type="application/javascript">
    (function () {
        "use strict";

        var FADE_MS = 200;                // matches the .boot opacity transition
        var FIRST_FRAME_GRACE_MS = 8000;  // how long the first-frame hook has before the safety net
        var RATE_SAMPLE_MS = 160;         // how long a download is watched before its speed is judged
        var WORTH_SHOWING_MS = 400;
        var HOLD_AT_FULL_MS = 200;

        if (document.documentElement.className === "no-webgl") return;

        var boot = document.getElementById("boot");
        if (!boot) return;

        var statusEl = document.getElementById("boot-status");
        var spinnerEl = document.getElementById("boot-spinner");
        var progressEl = document.getElementById("boot-progress");
        var barEl = document.getElementById("boot-bar");
        var percentEl = document.getElementById("boot-percent");

        // Hand-over to Compose.
        //
        // ComposeViewport(document.body) empties the body before appending its host and offers no
        // hook to run first, so the boot screen moves onto <html> straight away.
        //
        // The hand-over waits for a drawn frame, not for that host: Compose appends its canvas as
        // soon as Kotlin's main() runs, but skiko is fetched and the first composition mounted only
        // afterwards. Main.kt calls __onAppFirstFrame once a frame has been rendered, and sets
        // __appFirstFrame in case it runs before this script does — App.js is requested from the
        // head and can run while the parser is still inside the body.
        var dismissed = false;

        function composeAttached() {
            var children = document.body.children;
            for (var i = 0; i < children.length; i++) {
                if (children[i].tagName !== "SCRIPT") return true;
            }
            return false;
        }

        function dismiss() {
            if (dismissed) return;
            dismissed = true;
            boot.setAttribute("data-fading", "");
            setTimeout(function () {
                if (boot.parentNode) boot.parentNode.removeChild(boot);
            }, FADE_MS);
        }

        if (typeof MutationObserver === "function") {
            var observer = new MutationObserver(function () {
                if (!composeAttached()) return;
                observer.disconnect();
                // Whatever happens between attaching and the first frame, the boot screen must not
                // be left covering a running app.
                setTimeout(dismiss, FIRST_FRAME_GRACE_MS);
            });
            document.documentElement.appendChild(boot);
            observer.observe(document.body, { childList: true });
        }
        // Without MutationObserver the boot screen stays in the body, where ComposeViewport's
        // clear removes it without a fade.

        window.__onAppFirstFrame = dismiss;
        if (window.__appFirstFrame) dismiss();

        // Download progress.
        //
        // Patches WebAssembly.instantiateStreaming (and compileStreaming) to count decoded bytes
        // through a wrapping stream, measured against the manifest's uncompressed total. Both
        // numbers are uncompressed whatever the host compresses with; Content-Length describes the
        // encoded body, which this never sees. Both binaries go through the same call: the app
        // module first, then skiko once Kotlin's main() runs.
        //
        // A missing manifest, a response with no readable body, or anything throwing leaves the
        // indeterminate spinner in place.
        var manifest = self.__WASM_MANIFEST__;
        var total = manifest && typeof manifest.total === "number" ? manifest.total : 0;
        if (!total || total <= 0) return;
        if (typeof WebAssembly === "undefined") return;
        if (typeof ReadableStream === "undefined" || typeof Response === "undefined") return;
        if (!progressEl || !barEl || !percentEl) return;

        var loaded = 0;
        var sampleStart = 0;  // when the response currently streaming started,
        var sampleBytes = 0;  // and how much of it has arrived
        var revealed = false;
        var finished = false;

        function paint() {
            var fraction = loaded / total;
            if (fraction > 1) fraction = 1;
            var whole = Math.round(fraction * 100);
            barEl.style.transform = "scaleX(" + fraction + ")";
            percentEl.textContent = whole + "%";
            progressEl.setAttribute("aria-valuenow", String(whole));
        }

        // Shows the bar only once the remaining download, at the current response's rate, would
        // take longer than WORTH_SHOWING_MS. Judging by what remains rather than what has arrived
        // keeps a cache-served load from flashing the bar: skiko is only requested once main()
        // runs, so the two binaries are fetched seconds apart.
        function considerReveal() {
            if (revealed || finished) return;
            var elapsed = Date.now() - sampleStart;
            if (elapsed < RATE_SAMPLE_MS || sampleBytes <= 0) return;
            var remaining = total - loaded;
            if (remaining <= 0) return;
            if (remaining / (sampleBytes / elapsed) < WORTH_SHOWING_MS) return;
            revealed = true;
            progressEl.hidden = false;
            if (spinnerEl) spinnerEl.style.display = "none";
            paint();
        }

        // Instantiating the module, running main() and booting skiko follow the download, so the
        // indeterminate spinner returns for that stretch.
        function handBackToSpinner() {
            progressEl.hidden = true;
            if (spinnerEl) spinnerEl.style.display = "";
            if (statusEl) statusEl.textContent = "Starting…";
        }

        function finish() {
            if (finished) return;
            finished = true;
            if (!revealed) {
                handBackToSpinner();
                return;
            }
            paint();
            setTimeout(handBackToSpinner, HOLD_AT_FULL_MS);
        }

        function onBytes(count) {
            if (!count) return;
            loaded += count;
            sampleBytes += count;
            if (revealed) paint(); else considerReveal();
            if (loaded / total >= 0.999) finish();
        }

        // Preserves status, statusText and headers: instantiateStreaming rejects a response not
        // served as application/wasm.
        function counting(response) {
            if (!response || !response.body || typeof response.body.getReader !== "function") {
                return response;
            }
            var reader = response.body.getReader();
            sampleStart = Date.now();
            sampleBytes = 0;
            // A response whose chunks arrive further apart than the sample window would otherwise
            // only be judged on its next chunk.
            setTimeout(considerReveal, RATE_SAMPLE_MS);
            var stream = new ReadableStream({
                pull: function (controller) {
                    return reader.read().then(function (result) {
                        if (result.done) {
                            controller.close();
                            return;
                        }
                        onBytes(result.value ? result.value.byteLength : 0);
                        controller.enqueue(result.value);
                    }).catch(function (error) {
                        controller.error(error);
                    });
                },
                cancel: function (reason) {
                    return reader.cancel(reason);
                }
            });
            return new Response(stream, {
                status: response.status,
                statusText: response.statusText,
                headers: response.headers
            });
        }

        function patch(name) {
            var original = WebAssembly[name];
            if (typeof original !== "function") return;
            WebAssembly[name] = function (source) {
                // Forwarded with apply rather than a fixed (source, importObject) signature: the
                // generated loader passes a third options argument that changes how the module is
                // compiled.
                var args = Array.prototype.slice.call(arguments);
                try {
                    args[0] = Promise.resolve(source).then(function (response) {
                        try {
                            return counting(response);
                        } catch (error) {
                            return response;
                        }
                    });
                } catch (error) {
                    return original.apply(WebAssembly, arguments);
                }
                return original.apply(WebAssembly, args);
            };
        }

        try {
            patch("instantiateStreaming");
            patch("compileStreaming");
        } catch (error) {
            // A failed patch leaves the spinner; it is no reason to fail the boot.
        }
    })();
</script>
</body>
</html>
