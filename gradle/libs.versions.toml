[versions]
agp = "9.0.0"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.19.0"
androidx-lifecycle = "2.10.0"
composeMultiplatform = "1.11.1"
kotlin = "2.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.1"
kotlinx-browser = "0.5.0"
koin = "4.2.2"
ksp = "2.3.9"
ktor = "3.5.1"
logback = "1.5.37"
# Not applied anywhere — the Ktor plugin applies Shadow — but build-logic compiles against the
# ShadowJar type, and Ktor keeps Shadow out of its consumable compile metadata. Keep this equal to
# the version Ktor brings: `./gradlew :app:server:buildEnvironment | grep shadow`.
shadow = "9.1.0"
konsist = "0.17.3"
paparazzi = "2.0.0-alpha05"
composablePreviewScanner = "0.9.0"
junit5 = "5.11.4"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-testJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
composablePreviewScanner-android = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

ktor-websockets = { module = "io.ktor:ktor-websockets", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-serverWebsockets = { module = "io.ktor:ktor-server-websockets-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }

ktor-clientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-clientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-clientJs = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-clientWebsockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-clientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }

konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

enro-core = { module = "dev.enro:enro" }
enro-common = { module = "dev.enro:enro-common" }
enro-test = { module = "dev.enro:enro-test" }
enro-processor = { module = "dev.enro:enro-processor" }

udytils-core = { module = "dev.isaacudy.udytils:core" }
udytils-ui = { module = "dev.isaacudy.udytils:ui" }
udytils-snapshot = { module = "dev.isaacudy.udytils:snapshot" }

urpc-protocol = { module = "dev.isaacudy.udytils:urpc-protocol" }
urpc-client = { module = "dev.isaacudy.udytils:urpc-client" }
urpc-server = { module = "dev.isaacudy.udytils:urpc-server" }
urpc-koin = { module = "dev.isaacudy.udytils:urpc-koin" }
urpc-processor = { module = "dev.isaacudy.udytils:urpc-processor" }

# Postgres toolkit. `postgres-core` (runtime) and `postgres-koin` are production artifacts;
# `postgres-embedded` is dev/test only (it drags in Zonky + the Postgres binaries) and belongs
# to `:platform:server:development` alone. `postgres-gradlePlugin` is a buildscript-classpath
# artifact — see the root build file.
udytils-postgres-core = { module = "dev.isaacudy.udytils:postgres-core" }
udytils-postgres-koin = { module = "dev.isaacudy.udytils:postgres-koin" }
udytils-postgres-embedded = { module = "dev.isaacudy.udytils:postgres-embedded" }
udytils-postgres-gradlePlugin = { module = "dev.isaacudy.udytils:postgres-gradle-plugin" }

udytils-architectureCore = { module = "dev.isaacudy.udytils:architecture-core" }
udytils-architectureAnnotations = { module = "dev.isaacudy.udytils:architecture-annotations" }
udytils-architectureGradlePlugin = { module = "dev.isaacudy.udytils:architecture-gradle-plugin" }
udytils-atlasGradlePlugin = { module = "dev.isaacudy.udytils:atlas-gradle-plugin" }

# Build-logic dependencies (gradle plugin classpath artifacts)
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-serialization-gradlePlugin = { module = "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
# The Ktor Gradle plugin is published under its own plugin-id group; it applies Shadow, whose
# `shadowJar` task ukpt.server-packaging configures.
ktor-gradlePlugin = { module = "io.ktor.plugin:plugin", version.ref = "ktor" }
shadow-gradlePlugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
paparazzi-gradlePlugin = { module = "app.cash.paparazzi:paparazzi-gradle-plugin", version.ref = "paparazzi" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlinKsp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Version-less: resolved from the root buildscript classpath (composite-substituted), not a repository.
udytilsArchitecture = { id = "dev.isaacudy.udytils.architecture" }
udytilsAtlas = { id = "dev.isaacudy.udytils.atlas" }
udytilsPostgres = { id = "dev.isaacudy.udytils.postgres" }
